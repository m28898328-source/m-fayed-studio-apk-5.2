name: Build M-Fayed Studio 5.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        working-directory: source/m-fayed-studio-apk
        run: npm install

      - name: Add Android
        working-directory: source/m-fayed-studio-apk
        run: npx cap add android

      - name: Copy Native Files and Icons
        working-directory: source/m-fayed-studio-apk
        run: |
          D=android/app/src/main/java/com/mfayed/studio
          mkdir -p $D
          cp native/*.java $D/
          cp -r icons-res/* android/app/src/main/res/

      - name: Sync Android
        working-directory: source/m-fayed-studio-apk
        run: npx cap sync android

      - name: Build APK
        working-directory: source/m-fayed-studio-apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Fayed-Studio-5.2
          path: source/m-fayed-studio-apk/android/app/build/outputs/apk/debug/app-debug.apk
